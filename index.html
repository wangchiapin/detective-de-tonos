<style>
html{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#f6f4ef;color:#2b2b2b;font:16px/1.5 system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:640px;margin:0 auto;padding:16px 14px 8px}
h1{margin:4px 0 2px;font-size:22px;font-weight:600;letter-spacing:.04em}
h1 small{display:block;font-size:13px;font-weight:400;color:#8a857b;letter-spacing:0}
.bar{display:flex;flex-wrap:wrap;gap:6px 10px;margin:12px 0 8px;font-size:13px;color:#6f6a60}
.bar .grp{display:flex;align-items:center;gap:4px}
.seg{display:inline-flex;border:1px solid #cfc9bd;border-radius:6px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:4px 9px;font:inherit;color:#6f6a60;cursor:pointer}
.seg button+button{border-left:1px solid #e3ded3}
.seg button.on{background:#2b2b2b;color:#fff}
.note{font-size:13px;color:#6f6a60;background:#fff;border:1px solid #e3ded3;border-radius:6px;padding:8px 10px;margin:8px 0 12px}
.note small{display:block;color:#8a857b;margin-top:2px}
.card{background:#fff;border:1px solid #e3ded3;border-radius:8px;padding:14px 12px;margin-bottom:12px}
.btn{border:1px solid #2b2b2b;background:#2b2b2b;color:#fff;border-radius:6px;padding:10px 18px;font:inherit;cursor:pointer}
.btn.ghost{background:#fff;color:#2b2b2b}
.btn[disabled]{opacity:.35;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sub{color:#8a857b;font-size:13px}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 14px}
.choose button{border:1px solid #cfc9bd;background:#fff;border-radius:8px;padding:14px 8px;font:inherit;cursor:pointer;text-align:center}
.choose button.on{border-color:#2b2b2b;box-shadow:inset 0 0 0 1px #2b2b2b}
.choose b{display:block;font-size:17px;font-weight:600}
.choose span{display:block;font-size:12px;color:#8a857b;margin-top:2px}
.prog{display:flex;justify-content:space-between;font-size:13px;color:#8a857b;margin-bottom:8px}
.listen{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.spk{width:52px;height:52px;border-radius:50%;border:1px solid #2b2b2b;background:#fff;font-size:22px;cursor:pointer}
.words{display:flex;flex-wrap:wrap;gap:10px 14px;margin:6px 0 4px}
.word{display:flex;gap:4px}
.syl{width:46px;text-align:center}
.hz{font-size:24px;line-height:1.2;min-height:29px}
.py{font-size:15px;min-height:23px;font-weight:600;letter-spacing:.01em}
.py.done{color:#2b2b2b}
.tones{display:flex;flex-direction:column;gap:3px;margin-top:3px}
.tones button{border:1px solid #cfc9bd;background:#fff;border-radius:5px;height:30px;padding:0;font:inherit;font-size:15px;cursor:pointer;color:#2b2b2b;line-height:1}
.tones button small{font-size:10px;color:#8a857b;margin-left:3px}
.tones button.on{background:#2b2b2b;color:#fff;border-color:#2b2b2b}
.tones button.on small{color:#cfc9bd}
.tones button[disabled]{cursor:default}
.neu{font-size:12px;color:#8a857b;border:1px dashed #cfc9bd;border-radius:5px;padding:4px 0;margin-top:3px}
.syl.ok .py{color:#3d6b4f}
.syl.bad .py{color:#a8453a;text-decoration:line-through}
.fix{font-size:15px;font-weight:600;color:#3d6b4f;min-height:20px}
.res{margin-top:12px;padding-top:10px;border-top:1px solid #eee9de}
.res .line{font-size:15px}
.res .tr{color:#8a857b;font-size:14px;margin-top:2px}
.score{font-size:15px;margin-bottom:6px}
.big{font-size:34px;font-weight:600;margin:6px 0}
.hint{font-size:12px;color:#8a857b;margin-top:6px}
</style>

/* ===== 聲調標記 ===== */
const VM={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ'};
function mark(p,t){
  if(!t) return p;
  let idx=p.indexOf('a'); if(idx<0) idx=p.indexOf('e');
  if(idx<0){ const k=p.indexOf('ou'); if(k>=0) idx=k; }
  if(idx<0){ for(let i=p.length-1;i>=0;i--) if('iouü'.indexOf(p[i])>=0){idx=i;break;} }
  if(idx<0) return p;
  return p.slice(0,idx)+VM[p[idx]][t-1]+p.slice(idx+1);
}

/* ===== 語音 ===== */
function pickVoice(){
  let vs=[]; try{ vs=window.speechSynthesis.getVoices()||[]; }catch(e){}
  const ok=v=>{ const l=String(v.lang||'').toLowerCase().replace(/_/g,'-'); if(l.indexOf('yue')===0||l.indexOf('zh-hk')===0) return false; return l==='zh'||l.indexOf('zh-')===0||l.indexOf('cmn')===0; };
  const tw=vs.filter(v=>{ const l=String(v.lang||'').toLowerCase().replace(/_/g,'-'); return l==='zh-tw'||l==='cmn-tw'||l.indexOf('zh-tw')===0; });
  return tw[0]||vs.filter(ok)[0]||null;
}
function speak(text){
  try{
    const ss=window.speechSynthesis; if(!ss) return; ss.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang='zh-TW';
    const v=pickVoice(); if(v){ u.voice=v; u.lang=v.lang; }
    u.rate=RATE_VALUE[Settings.rate]||0.65; ss.speak(u);
  }catch(e){}
}

    <div class="grp"><span>${tz('scriptName')}</span><span class="seg" id="sgScript"><button data-v="trad" class="${Settings.script==='trad'?'on':''}">繁</button><button data-v="simp" class="${Settings.script==='simp'?'on':''}">简</button></span></div>
    <div class="grp"><span>Idioma</span><span class="seg" id="sgLang"><button data-v="es" class="${Settings.lang==='es'?'on':''}">ES</button><button data-v="en" class="${Settings.lang==='en'?'on':''}">EN</button><button data-v="zh" class="${Settings.lang==='zh'?'on':''}">中文</button></span></div>
  </div>
  <div class="note">${tz('note')}${Settings.lang==='zh'?'':`<small>${tl('note')}</small>`}${G.mode==='listen'?`<div style="margin-top:6px">${tz('listenNote')}${Settings.lang==='zh'?'':`<small>${tl('listenNote')}</small>`}</div>`:''}</div>`;
}
function bindHeader(){
  document.querySelectorAll('#sgScript button').forEach(b=>b.onclick=()=>{ Settings.script=b.dataset.v; writeSettings(Settings); render(true); });
  document.querySelectorAll('#sgLang button').forEach(b=>b.onclick=()=>{ Settings.lang=b.dataset.v; writeSettings(Settings); render(true); });
}

function renderHome(){
  const lvs=['all','A1','A2','B1'];
  app.innerHTML=header()+`<div class="card">
    <div class="choose" id="chMode">
      <button data-v="read" class="${G.mode==='read'?'on':''}"><b>${tz('modeRead')}</b><span>${tz('modeReadD')}${Settings.lang==='zh'?'':'<br>'+tl('modeReadD')}</span></button>
      <button data-v="listen" class="${G.mode==='listen'?'on':''}"><b>${tz('modeListen')}</b><span>${tz('modeListenD')}${Settings.lang==='zh'?'':'<br>'+tl('modeListenD')}</span></button>
    </div>
    <div class="row" style="margin-bottom:10px"><span class="sub">${tx('level')}</span><span class="seg" id="sgLv">${lvs.map(l=>`<button data-v="${l}" class="${G.level===l?'on':''}">${l==='all'?tz('all'):l}</button>`).join('')}</span></div>
    <div class="row" style="margin-bottom:14px"><span class="sub">${tx('speed')}</span><span class="seg" id="sgRate">${['slow','normal','fast'].map(r=>`<button data-v="${r}" class="${Settings.rate===r?'on':''}">${tz(r)}</button>`).join('')}</span></div>
    <button class="btn" id="bStart">${tz('start')}</button>${Settings.lang==='zh'?'':`<div class="sub" style="margin-top:4px">${tl('start')}</div>`}
  </div>`;
  bindHeader();
  document.querySelectorAll('#chMode button').forEach(b=>b.onclick=()=>{ G.mode=b.dataset.v; writeG(); render(true); });
  document.querySelectorAll('#sgLv button').forEach(b=>b.onclick=()=>{ G.level=b.dataset.v; writeG(); render(true); });
  document.querySelectorAll('#sgRate button').forEach(b=>b.onclick=()=>{ Settings.rate=b.dataset.v; writeSettings(Settings); render(true); });
  document.getElementById('bStart').onclick=startGame;
}

function startGame(){
  const pool=SENTENCES.filter(s=>G.level==='all'||s.lv===G.level);
  qs=shuffle(pool).slice(0,10); qi=0; tot={syl:0,good:0,perfect:0}; screen='play';
  try{ HGPlays.start(G.mode+'_'+G.level); }catch(e){}
  newQ();
}
function newQ(){ const s=qs[qi]; ans=s.a.map(a=>a===0?0:null); checked=false; render(true); if(G.mode==='listen') speak(sentText(s)); }

function renderPlay(){
  const s=qs[qi], listen=G.mode==='listen', simp=Settings.script==='simp';
  const chars=simp?s.s:s.t;
  let html=header()+`<div class="card"><div class="prog"><span>${tz('q')} ${qi+1} / ${qs.length}</span><span>${s.lv}</span></div>`;
  if(listen) html+=`<div class="listen"><button class="spk" id="bSpk" aria-label="${tz('replay')}">🔊</button><div class="sub">${checked?tz('replay'):tz('listenFirst')}${Settings.lang==='zh'?'':'<br>'+(checked?tl('replay'):tl('listenFirst'))}</div></div>`;
  html+='<div class="words">';
  let pos=0;
  s.w.forEach(n=>{
    html+='<div class="word">';
    for(let k=0;k<n;k++){
      const i=pos+k, a=s.a[i], neutral=a===0, v=ans[i];
      let cls='syl', py=s.p[i], fix='';
      if(checked&&!neutral){ cls+=v===a?' ok':' bad'; if(v!==a) fix=mark(s.p[i],a); }
      const shown=neutral?s.p[i]:(v?mark(s.p[i],v):s.p[i]);
      const hz=(!listen||checked)?chars[i]:'';
      html+=`<div class="${cls}" data-i="${i}"><div class="hz">${hz}</div><div class="py${v&&!neutral?' done':''}">${shown}</div>`;
      if(neutral) html+=`<div class="neu">${tz('neutral')}</div>`;
      else html+=`<div class="tones">${[1,2,3,4].map(t=>`<button data-t="${t}" class="${v===t?'on':''}" ${checked?'disabled':''} aria-label="tone ${t}">${TMARK[t]}<small>${t}</small></button>`).join('')}</div>`;
      if(checked&&!neutral) html+=`<div class="fix">${v===a?'':fix}</div>`;
      html+='</div>';
    }
    pos+=n; html+='</div>';
  });
  html+='</div>';
  const filled=ans.every(x=>x!==null);
  if(!checked){
    html+=`<div class="row" style="margin-top:12px"><button class="btn" id="bCheck" ${filled?'':'disabled'}>${tz('check')}</button>${filled?'':`<span class="sub">${tz('fillAll')}</span>`}</div>`;
  } else {
    const bad=s.a.reduce((n,a,i)=>n+(a!==0&&ans[i]!==a?1:0),0), need=s.a.filter(a=>a!==0).length;
    const full=chars.map((c,i)=>c).join('');
    const fullPy=s.w.reduce((acc,n)=>{ const word=[]; for(let k=0;k<n;k++){ word.push(mark(s.p[acc.p+k],s.a[acc.p+k])); } acc.out.push(word.join(' ')); acc.p+=n; return acc; },{out:[],p:0}).out.join(' ');
    html+=`<div class="res"><div class="score">${need-bad} / ${need} ${tz('goodSyl')}${bad===0?' ✓':''}</div><div class="line">${full}</div><div class="line" style="color:#6f6a60">${fullPy}</div>${Settings.lang==='zh'?'':`<div class="tr">${Settings.lang==='en'?s.en:s.es}</div>`}
    <div class="row" style="margin-top:12px"><button class="btn ghost" id="bSpk2">🔊 ${tz('replay')}</button><button class="btn" id="bNext">${qi+1<qs.length?tz('next'):tz('finish')}</button></div></div>`;
  }
  html+='</div>';
  app.innerHTML=html; bindHeader();
  app.querySelectorAll('.syl').forEach(el=>{
    el.querySelectorAll('.tones button').forEach(b=>b.onclick=()=>{ if(checked) return; ans[+el.dataset.i]=+b.dataset.t; renderPlay(); });
  });
  const sp=document.getElementById('bSpk'); if(sp) sp.onclick=()=>speak(sentText(s));
  const sp2=document.getElementById('bSpk2'); if(sp2) sp2.onclick=()=>speak(sentText(s));
  const bc=document.getElementById('bCheck'); if(bc) bc.onclick=doCheck;
  const bn=document.getElementById('bNext'); if(bn) bn.onclick=()=>{ if(qi+1<qs.length){ qi++; newQ(); } else { screen='result'; render(true); try{ HGPlays.end({score:tot.good}); }catch(e){} } };
}
function doCheck(){
  const s=qs[qi]; checked=true; let bad=0, need=0;
  s.a.forEach((a,i)=>{ if(a!==0){ need++; if(ans[i]!==a) bad++; } });
  tot.syl+=need; tot.good+=need-bad; if(bad===0) tot.perfect++;
  renderPlay();
}
function renderResult(){
  app.innerHTML=header()+`<div class="card"><div class="sub">${tz('result')}</div><div class="big">${tot.good} / ${tot.syl}</div><div class="score">${tz('goodSyl')}</div><div class="score">${tz('perfect')}：${tot.perfect} / ${qs.length}</div>
  <div class="row" style="margin-top:12px"><button class="btn" id="bAgain">${tz('again')}</button><button class="btn ghost" id="bHome">${tz('home')}</button></div></div>`;
  bindHeader();
  document.getElementById('bAgain').onclick=startGame;
  document.getElementById('bHome').onclick=()=>{ screen='home'; render(true); };
}
function render(scroll){
  if(screen==='home') renderHome(); else if(screen==='play') renderPlay(); else renderResult();
  document.documentElement.lang=Settings.script==='simp'?'zh-Hans':'zh-Hant';
  if(scroll) top();
}
render();
})();
</script>
<script>
/* ===== 找不到中文聲音的提示（每天一分鐘遊戲統一做法）===== */
(function(){
  var shown=false;
  function cfg(){ var s={}; try{ s=JSON.parse(localStorage.getItem('hanziGames.settings')||'{}')||{}; }catch(e){} return s; }
  function isMandarin(v){ var l=String((v&&v.lang)||'').toLowerCase().replace(/_/g,'-'); if(l.indexOf('yue')===0||l.indexOf('zh-hk')===0) return false; return l==='zh'||l.indexOf('zh-')===0||l.indexOf('cmn')===0; }
  var T={
    none:{ zh:['這個裝置找不到中文（台灣）語音，聽不到念的內容。請到手機設定安裝「中文（台灣）」語音，或換一個裝置。','这个装置找不到中文（台湾）语音，听不到念的内容。请到手机设置安装「中文（台湾）」语音，或换一个装置。'],
           es:'No se encontró una voz de chino (Taiwán) en este dispositivo, así que no se oirá el audio. Instala la voz «chino (Taiwán)» en los ajustes del móvil o usa otro dispositivo.',
           en:'No Chinese (Taiwan) voice was found on this device, so you won’t hear the audio. Install the “Chinese (Taiwan)” voice in your phone settings, or use another device.' },
    nosynth:{ zh:['這個瀏覽器不支援語音，聽不到念的內容。請換一個瀏覽器（例如 Chrome、Safari）。','这个浏览器不支持语音，听不到念的内容。请换一个浏览器（例如 Chrome、Safari）。'],
           es:'Este navegador no admite voz, así que no se oirá el audio. Usa otro navegador (por ejemplo Chrome o Safari).',
           en:'This browser does not support speech, so you won’t hear the audio. Try another browser (for example Chrome or Safari).' }
  };
  function show(kind){
    if(shown||document.getElementById('hgVoiceHint')) return; shown=true;
    var s=cfg(), lang=s.lang||'es', simp=s.script==='simp', t=T[kind];
    var st=document.createElement('style');
    st.textContent='#hgVoiceHint{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:2147482999;width:min(94vw,520px);box-sizing:border-box;display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:#fff6dc;border:1px solid #d8b24a;color:#5b4410;font:13px/1.4 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.25)}#hgVoiceHint .m{flex:1}#hgVoiceHint .m small{display:block;font-size:11px;opacity:.85;margin-top:2px}#hgVoiceHint button{border:0;background:transparent;color:inherit;font-size:16px;line-height:1;padding:0 2px;cursor:pointer}';
    document.head.appendChild(st);
    var d=document.createElement('div'); d.id='hgVoiceHint'; d.setAttribute('role','status');
    var m=document.createElement('div'); m.className='m';
    var zh=document.createElement('div'); zh.textContent = simp ? t.zh[1] : t.zh[0]; m.appendChild(zh);
    if(lang!=='zh'){ var sm=document.createElement('small'); sm.textContent = lang==='en' ? t.en : t.es; m.appendChild(sm); }
    var x=document.createElement('button'); x.type='button'; x.textContent='✕'; x.setAttribute('aria-label','Close');
    x.addEventListener('click',function(){ d.remove(); });
    d.appendChild(m); d.appendChild(x); document.body.appendChild(d);
  }
  function check(){
    try{
      if(!window.speechSynthesis){ show('nosynth'); return; }
      var vs=window.speechSynthesis.getVoices()||[];
      if(vs.length && !vs.some(isMandarin)) show('none');   // 清單是空的時（有些手機一開始就是空的）先不判斷
    }catch(e){}
  }
  function start(){
    check();
    try{ window.speechSynthesis.addEventListener('voiceschanged', check); }catch(e){}
    setTimeout(check,1500); setTimeout(check,4000);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
/* ===== /找不到中文聲音的提示 ===== */

</script>

<script>
/* ===== 遊玩紀錄（hgPlays）— 每個遊戲共用，貼在 </body> 前 =====
   用法：
     HGPlays.visit();                       // 頁面打開時（本檔會自動呼叫一次）
     HGPlays.start('easy', '小明');         // 真的開始玩一局（關卡／難度、暱稱都可省略）
     HGPlays.end({score: 120, name: '小明'}); // 這一局正常結算（score、name 可省略）
   沒呼叫 end 的那一局，後台就會顯示「沒玩完」。
   寫到 memorma 專案：plays（每局）、visits（每台裝置每天每遊戲一筆）。
   任何錯誤都靜默，不影響遊戲。 */
(function () {
  var GAME = 'detective_de_tonos';          // ← 每個遊戲改成自己的代號（英文小寫、底線）
  var NAME_GETTER = null;                // ← 可選：function(){ return 目前暱稱或'' }
  var CFG = { apiKey: 'AIzaSyC_YSDn2OH6_GKKwCq0d8QFNl3fYXzTC60', authDomain: 'memorma-24dab.firebaseapp.com',
              projectId: 'memorma-24dab', appId: '1:806709458465:web:f0d12acb2f911f2f165560' };
  var V = '10.12.2', CDN = 'https://www.gstatic.com/firebasejs/' + V + '/';
  var cur = null, readyP = null, lib = null;

  function gid() { try { return (HG.gameFn ? HG.gameFn() : GAME) || GAME; } catch (e) { return GAME; } } // taiwan-life 這類共用引擎的遊戲可改寫 HGPlays.gameFn
  function day() { // 以台灣時間（UTC+8）算「哪一天」，方便老師對帳
    var d = new Date(Date.now() + 8 * 3600e3);
    return d.toISOString().slice(0, 10);
  }
  function ls(k, v) {
    try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {}
    return null;
  }
  function ready() {
    if (readyP) return readyP;
    readyP = (async function () {
      var A = await import(CDN + 'firebase-app.js');
      var Au = await import(CDN + 'firebase-auth.js');
      var F = await import(CDN + 'firebase-firestore.js');
      var app = A.initializeApp(CFG, 'hgplays');
      var auth = Au.getAuth(app);
      if (!auth.currentUser) await Au.signInAnonymously(auth);
      else await auth.authStateReady();
      lib = { F: F, db: F.getFirestore(app), uid: auth.currentUser.uid };
      return lib;
    })().catch(function () { readyP = null; return null; });
    return readyP;
  }
  function getName(n) {
    if (n) return String(n).slice(0, 36);
    try { if (NAME_GETTER) return String(NAME_GETTER() || '').slice(0, 36); } catch (e) {}
    return '';
  }

  var HG = window.HGPlays = {
    /* 每台裝置每天、每個遊戲只算一次訪客 */
    visit: function () {
      var g = gid(), d = day(), key = 'hg.visit.' + g;
      if (ls(key) === d) return;
      ready().then(function (L) {
        if (!L) return;
        var id = d + '_' + g + '_' + L.uid;
        return L.F.setDoc(L.F.doc(L.db, 'visits', id), { game: g, day: d, uid: L.uid, at: L.F.serverTimestamp() })
          .then(function () { ls(key, d); });
      }).catch(function () {});
    },
    /* 真的開始玩一局 */
    start: function (level, name) {
      var mine = cur = { id: null, level: level == null ? '' : String(level).slice(0, 30) };
      ready().then(function (L) {
        if (!L) return;
        var data = { game: gid(), level: mine.level, uid: L.uid, name: getName(name), day: day(),
                     startedAt: L.F.serverTimestamp(), done: false };
        return L.F.addDoc(L.F.collection(L.db, 'plays'), data).then(function (ref) {
          mine.id = ref.id; if (mine.pendingEnd) HG._finish(mine, mine.pendingEnd);
        });
      }).catch(function () {});
    },
    /* 這一局正常結算 */
    end: function (info) {
      var mine = cur; if (!mine || mine.ended) return; mine.ended = true; info = info || {};
      if (mine.id) HG._finish(mine, info); else mine.pendingEnd = info; // 開始的寫入還沒回來就先記著
    },
    _finish: function (mine, info) {
      ready().then(function (L) {
        if (!L || !mine.id) return;
        var u = { done: true, endedAt: L.F.serverTimestamp(),
                  secs: Math.max(0, Math.min(86400, Math.round(Number(info.secs != null ? info.secs : (Date.now() - (mine.t0 || Date.now())) / 1000) || 0))) };
        var s = Number(info.score); if (isFinite(s) && info.score != null) u.score = Math.max(-1e9, Math.min(1e9, Math.round(s)));
        var n = getName(info.name); if (n) u.name = n;
        return L.F.updateDoc(L.F.doc(L.db, 'plays', mine.id), u);
      }).catch(function () {});
    }
  };
  var _s = HG.start; HG.start = function (l, n) { _s(l, n); if (cur) cur.t0 = Date.now(); };
  setTimeout(function () { HG.visit(); }, 2500);   // 等遊戲載完再記訪客
})();
</script>
