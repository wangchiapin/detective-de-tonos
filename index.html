<script>
/* 句庫來源：corre 網站上的 bank/A1／A2／B1.json（每天會新增句子，這裡不用再手動更新）。
   上面 data.js 只是「備用快照」：網路讀不到、或檔案格式不對時就用它，遊戲照樣能玩。
   轉換規則要跟 build_data.js 一致：一、不一律用本調；拼音拆成無調拼音＋聲調。 */
(function(){
  const BASE='https://wangchiapin.github.io/corre/bank/';
  const MARK={ā:['a',1],á:['a',2],ǎ:['a',3],à:['a',4],ē:['e',1],é:['e',2],ě:['e',3],è:['e',4],ī:['i',1],í:['i',2],ǐ:['i',3],ì:['i',4],ō:['o',1],ó:['o',2],ǒ:['o',3],ò:['o',4],ū:['u',1],ú:['u',2],ǔ:['u',3],ù:['u',4],ǖ:['ü',1],ǘ:['ü',2],ǚ:['ü',3],ǜ:['ü',4]};
  function parseSyl(syl){ let tone=0,plain=''; for(const c of syl){ if(MARK[c]){plain+=MARK[c][0];tone=MARK[c][1];} else plain+=c; } return {plain,tone}; }
  function convert(L,j){
    if(!j||!Array.isArray(j.sentences)||j.sentences.length<1) return null;
    const out=[];
    for(const s of j.sentences){
      const chars=[],simp=[],syls=[]; let bad=false;
      if(!s||!Array.isArray(s.trad)||!Array.isArray(s.simp)||!Array.isArray(s.pinyin)||s.trad.length!==s.simp.length||s.trad.length!==s.pinyin.length||typeof s.id!=='string') continue;
      s.trad.forEach((t,i)=>{
        const ps=String(s.pinyin[i]).split(' '),tc=[...t],sc=[...s.simp[i]];
        if(ps.length!==tc.length||sc.length!==tc.length){bad=true;return;}
        tc.forEach((c,k)=>{ let {plain,tone}=parseSyl(ps[k]); if(c==='不')tone=4; if(c==='一')tone=1; chars.push(c); simp.push(sc[k]); syls.push([plain,tone]); });
      });
      if(bad||!chars.length) continue;
      out.push({id:s.id,lv:L,t:chars,s:simp,p:syls.map(x=>x[0]),a:syls.map(x=>x[1]),w:s.trad.map(t=>[...t].length),es:String(s.es||''),en:String(s.en||'')});
    }
    return out.length?out:null;
  }
  window.__loadBank=function(){
    return Promise.all(['A1','A2','B1'].map(L=>{
      const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),8000);
      return fetch(BASE+L+'.json',{signal:ctl.signal}).then(r=>{ if(!r.ok) throw new Error(L+' '+r.status); return r.json(); })
        .then(j=>{ clearTimeout(to); const rows=convert(L,j); if(!rows) throw new Error(L+' 格式不對'); return [L,rows]; })
        .catch(e=>{ clearTimeout(to); return null; });   // 這一級讀不到就維持備用快照
    })).then(res=>{
      let n=0;
      res.forEach(x=>{ if(!x) return; const [L,rows]=x;
        for(let i=SENTENCES.length-1;i>=0;i--) if(SENTENCES[i].lv===L) SENTENCES.splice(i,1);
        SENTENCES.push(...rows); n++; });
      window.__bankLive=n;   // 這次有幾級換成最新的（0～3）
      return n;
    });
  };
  window.__loadBank();
})();

const VM={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ'};
function mark(p,t){
  if(!t) return p;
  let idx=p.indexOf('a'); if(idx<0) idx=p.indexOf('e');
  if(idx<0){ const k=p.indexOf('ou'); if(k>=0) idx=k; }
  if(idx<0){ for(let i=p.length-1;i>=0;i--) if('iouü'.indexOf(p[i])>=0){idx=i;break;} }
  if(idx<0) return p;
  return p.slice(0,idx)+VM[p[idx]][t-1]+p.slice(idx+1);
}

function pickVoice(){
  let vs=[]; try{ vs=window.speechSynthesis.getVoices()||[]; }catch(e){}
  const ok=v=>{ const l=String(v.lang||'').toLowerCase().replace(/_/g,'-'); if(l.indexOf('yue')===0||l.indexOf('zh-hk')===0) return false; return l==='zh'||l.indexOf('zh-')===0||l.indexOf('cmn')===0; };
  const tw=vs.filter(v=>{ const l=String(v.lang||'').toLowerCase().replace(/_/g,'-'); return l==='zh-tw'||l==='cmn-tw'||l.indexOf('zh-tw')===0; });
  return tw[0]||vs.filter(ok)[0]||null;
}
function speak(text){
  try{
    const ss=window.speechSynthesis; if(!ss) return; ss.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang='zh-TW';
    const v=pickVoice(); if(v){ u.voice=v; u.lang=v.lang; }
    u.rate=RATE_VALUE[Settings.rate]||0.65;
    const rec=on=>{ const b=document.querySelector('.listen'); if(b) b.classList.toggle('rec',on); };
    u.onstart=()=>rec(true); u.onend=u.onerror=()=>rec(false);
    ss.speak(u);
  }catch(e){}
}

async function submitScore(mode,name,score){
  const L=await fbInit(); if(!L) throw new Error('no firebase');
  const ref=L.F.doc(L.db,'tone_boards',mode,'entries',L.uid);
  const snap=await L.F.getDoc(ref);
  if(snap.exists()){ const old=snap.data(); if(old.score>=score){ if(old.name===name) return 'kept'; score=old.score; } }   // 不比舊的高：分數維持，只更新暱稱
  await L.F.setDoc(ref,{name,score,updatedAt:L.F.serverTimestamp()});
  topCache[mode]=null; return 'saved';
}
async function fetchTop(mode){
  const c=topCache[mode]; if(c&&Date.now()-c.t<60000) return c.v;   // 60 秒暫存，反覆開關不重複讀取
  const L=await fbInit(); if(!L) throw new Error('no firebase');
  const q=L.F.query(L.F.collection(L.db,'tone_boards',mode,'entries'),L.F.orderBy('score','desc'),L.F.limit(10));
  const snap=await L.F.getDocs(q);
  const rows=snap.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>b.score-a.score).slice(0,10);
  const v={rows,uid:L.uid}; topCache[mode]={t:Date.now(),v}; return v;
}

  const b=document.getElementById('bRep'); if(b) b.onclick=()=>{ rep={why:'',note:'',st:'',msg:''}; drawRep(); };
  const c=document.getElementById('repCancel'); if(c) c.onclick=()=>{ rep=null; drawRep(); };
  const s=document.getElementById('repSend'); if(s) s.onclick=repSend;
  const n=document.getElementById('repNote'); if(n) n.oninput=()=>{ rep.note=n.value; };
  document.querySelectorAll('#rep .rw button').forEach(x=>x.onclick=()=>{
    const nn=document.getElementById('repNote'); if(nn) rep.note=nn.value;
    rep.why=x.dataset.w; if(rep.msg==='rPick') rep.msg=''; drawRep();
  });
}
function repData(){
  const s=qs[qi], py=a=>s.p.map((p,i)=>mark(p,a[i])).join(' ');
  return {game:'tonos',why:rep.why,note:String(rep.note||'').trim().slice(0,100),id:s.id,lv:s.lv,mode:G.mode,han:s.t.join(''),py:s.p.join(' '),ans:py(s.a),pick:py(ans),lang:Settings.lang,ver:REP_VER};
}
async function repSend(){
  const r=rep; if(!r||r.st==='sending') return;
  const n=document.getElementById('repNote'); if(n) r.note=n.value;
  if(!r.why){ r.msg='rPick'; return drawRep(); }
  const data=repData(); r.st='sending'; r.msg='rSending'; drawRep();
  try{
    const L=await repConn();
    await L.F.addDoc(L.F.collection(L.db,'game_reports'),Object.assign(data,{done:false,at:L.F.serverTimestamp()}));
    r.st='ok'; r.msg='';
  }catch(e){ r.st='err'; r.msg='rFail'; }
  if(rep===r) drawRep();
}

function renderPlay(){
  const s=qs[qi], listen=G.mode==='listen', simp=Settings.script==='simp';
  const chars=simp?s.s:s.t;
  let html=header()+`<div class="card"><div class="prog"><span class="tag">${tz('case')} ${s.id}</span>${steps(qi,qs.length)}</div>`;
  if(listen) html+=`<div class="listen"><button class="spk" id="bSpk" aria-label="${tz('replay')}">🔊</button><span class="reels"><i></i><i></i></span><div class="sub">${checked?tz('replay'):tz('listenFirst')}${Settings.lang==='zh'?'':'<br>'+(checked?tl('replay'):tl('listenFirst'))}</div></div>`;
  html+=`<div class="words${s.t.length>=10&&!wideMQ.matches?' compact':''}">`;
  let pos=0;
  s.w.forEach(n=>{
    html+='<div class="word">';
    for(let k=0;k<n;k++){
      const i=pos+k, a=s.a[i], neutral=a===0, v=ans[i];
      let cls='syl', py=s.p[i], fix='';
      if(checked&&!neutral){ cls+=v===a?' ok':' bad'; if(v!==a) fix=mark(s.p[i],a); }
      const shown=neutral?s.p[i]:(v?mark(s.p[i],v):s.p[i]);
      const hz=(!listen||checked)?chars[i]:'';
      html+=`<div class="${cls}" data-i="${i}"><div class="hz">${hz}</div><div class="py${v&&!neutral?' done':''}">${shown}</div>`;
      if(neutral) html+=`<div class="neu">${tz('neutral')}</div>`;
      else html+=`<div class="tones">${[1,2,3,4].map(t=>`<button data-t="${t}" class="${v===t?'on':''}" ${checked?'disabled':''} aria-label="tone ${t}">${toneSvg(t)}<small>${t}</small></button>`).join('')}</div>`;
      if(checked&&!neutral) html+=`<div class="fix">${v===a?'':fix}</div>`;
      html+='</div>';
    }
    pos+=n; html+='</div>';
  });
  html+='</div>';
  const filled=ans.every(x=>x!==null);
  if(!checked){
    html+=`<div class="row" style="margin-top:12px"><button class="btn" id="bCheck" ${filled?'':'disabled'}>${MAG}${tz('check')}</button>${filled?'':`<span class="sub">${tz('fillAll')}</span>`}</div>`;
  } else {
    const bad=s.a.reduce((n,a,i)=>n+(a!==0&&ans[i]!==a?1:0),0), need=s.a.filter(a=>a!==0).length;
    const full=chars.map((c,i)=>c).join('');
    const fullPy=s.w.reduce((acc,n)=>{ const word=[]; for(let k=0;k<n;k++){ word.push(mark(s.p[acc.p+k],s.a[acc.p+k])); } acc.out.push(word.join(' ')); acc.p+=n; return acc; },{out:[],p:0}).out.join(' ');
    html+=`<div class="res"><div class="score">${need-bad} / ${need} ${tz('goodSyl')}${bad===0?' ✓':''}</div><div class="line">${full}</div><div class="line" style="color:#6f6a60">${fullPy}</div>${Settings.lang==='zh'?'':`<div class="tr">${Settings.lang==='en'?s.en:s.es}</div>`}
    <div class="row" style="margin-top:12px">${listen?'':`<button class="btn ghost" id="bSpk2">🔊 ${tz('replay')}</button>`}<button class="btn" id="bNext">${qi+1<qs.length?tz('next'):tz('finish')}</button></div><div id="rep">${repHtml()}</div></div>`;
  }
  html+='</div>';
  app.innerHTML=html; bindHeader();
  app.querySelectorAll('.syl').forEach(el=>{
    el.querySelectorAll('.tones button').forEach(b=>b.onclick=()=>{ if(checked) return; ans[+el.dataset.i]=+b.dataset.t; renderPlay(); });
  });
  const sp=document.getElementById('bSpk'); if(sp) sp.onclick=()=>speak(sentText(s));
  const sp2=document.getElementById('bSpk2'); if(sp2) sp2.onclick=()=>speak(sentText(s));
  const bc=document.getElementById('bCheck'); if(bc) bc.onclick=doCheck;
  bindRep();
  const bn=document.getElementById('bNext'); if(bn) bn.onclick=()=>{ if(qi+1<qs.length){ qi++; newQ(); } else { screen='result'; render(true); try{ HGPlays.end({score:tot.good}); }catch(e){} } };
}
function doCheck(){
  const s=qs[qi]; checked=true; let bad=0, need=0;
  s.a.forEach((a,i)=>{ if(a!==0){ need++; if(ans[i]!==a) bad++; } });
  tot.syl+=need; tot.good+=need-bad; if(bad===0) tot.perfect++;
  renderPlay();
}
function renderResult(){
  const ranked=G.level==='all'&&tot.syl>0, score=tot.syl?Math.round(tot.good/tot.syl*1000):0;
  app.innerHTML=header()+`<div class="card vprint vtop"><div class="sub">${tz('result')}</div><div class="big">${tot.good} / ${tot.syl}</div><div class="rank">${rankIcon(score)}${tz(score>=950?'rankA':score>=800?'rankB':'rankC')}${Settings.lang==='zh'?'':' · '+tl(score>=950?'rankA':score>=800?'rankB':'rankC')}</div><div class="score">${tz('goodSyl')}　${tz('accuracy')} ${pct(score)}</div><div class="score">${tz('perfect')}：${tot.perfect} / ${qs.length}</div>
  <div class="lbmsg" id="lbMsg">${ranked?tz('sending'):tz('notRanked')}${!ranked&&Settings.lang!=='zh'?'<br>'+tl('notRanked'):''}</div>
  <div class="row" style="margin-top:12px"><button class="btn" id="bAgain">${tz('again')}</button><button class="btn ghost" id="bBoard">🏆 ${tz('board')}</button><button class="btn ghost" id="bHome">${tz('home')}</button></div></div>`;
  bindHeader();
  document.getElementById('bAgain').onclick=startGame;
  document.getElementById('bBoard').onclick=()=>{ boardMode=G.mode; screen='board'; render(true); };
  document.getElementById('bHome').onclick=()=>{ screen='home'; render(true); };
  if(ranked&&!resultSent){
    resultSent=true; resultMsgKey='sending';
    const msg=k=>{ resultMsgKey=k; const el=document.getElementById('lbMsg'); if(el) el.textContent=tz(k); };
    submitScore(G.mode,getName(),score).then(r=>msg(r==='kept'?'kept':'submitted')).catch(()=>msg('submitFail'));
  } else if(ranked&&resultSent){ const el=document.getElementById('lbMsg'); if(el) el.textContent=tz(resultMsgKey); }
}
function renderBoard(){
  app.innerHTML=header()+`<div class="card"><div class="row" style="margin-bottom:8px"><b style="font-size:17px">🏆 ${tz('board')}</b><span class="seg" id="sgBoard"><button data-v="read" class="${boardMode==='read'?'on':''}">${tz('modeRead')}</button><button data-v="listen" class="${boardMode==='listen'?'on':''}">${tz('modeListen')}</button></span></div>
  <div id="lbBody"><p class="sub">${tz('loading')}</p></div><div class="hint">${tz('boardNote')}${Settings.lang==='zh'?'':'<br>'+tl('boardNote')}</div>
  <div class="row" style="margin-top:12px"><button class="btn ghost" id="bBack">${tz('back')}</button></div></div>`;
  bindHeader();
  document.querySelectorAll('#sgBoard button').forEach(b=>b.onclick=()=>{ boardMode=b.dataset.v; renderBoard(); });
  document.getElementById('bBack').onclick=()=>{ screen=prevScreen; render(true); };
  const mine=boardMode;
  fetchTop(mine).then(({rows,uid})=>{
    const el=document.getElementById('lbBody'); if(!el||mine!==boardMode) return;
    el.innerHTML=rows.length?rows.map((r,i)=>`<div class="lbrow${r.id===uid?' me':''}"><span class="r">${i+1}</span><span class="n">${esc(r.name||'')}${r.id===uid?' '+esc(tz('you')):''}</span><span class="s">${pct(r.score|0)}</span></div>`).join(''):`<p class="sub">${tz('boardEmpty')}</p>`;
  }).catch(()=>{ const el=document.getElementById('lbBody'); if(el&&mine===boardMode) el.innerHTML=`<p class="sub">${tz('boardFail')}</p>`; });
}
let prevScreen='home', resultSent=false, resultMsgKey='submitted';
function render(scroll){
  if(screen!=='board') prevScreen=screen;
  if(screen==='home') renderHome(); else if(screen==='play') renderPlay(); else if(screen==='board') renderBoard(); else renderResult();
  document.documentElement.lang=Settings.script==='simp'?'zh-Hans':'zh-Hant';
  if(scroll) top();
}
wideMQ.addEventListener&&wideMQ.addEventListener('change',()=>render(false));
render();
})();
</script>
<script>
/* ===== 找不到中文聲音的提示（每天一分鐘遊戲統一做法）===== */
(function(){
  var shown=false;
  function cfg(){ var s={}; try{ s=JSON.parse(localStorage.getItem('hanziGames.settings')||'{}')||{}; }catch(e){} return s; }
  function isMandarin(v){ var l=String((v&&v.lang)||'').toLowerCase().replace(/_/g,'-'); if(l.indexOf('yue')===0||l.indexOf('zh-hk')===0) return false; return l==='zh'||l.indexOf('zh-')===0||l.indexOf('cmn')===0; }
  var T={
    none:{ zh:['這個裝置找不到中文（台灣）語音，聽不到念的內容。請到手機設定安裝「中文（台灣）」語音，或換一個裝置。','这个装置找不到中文（台湾）语音，听不到念的内容。请到手机设定安装「中文（台湾）」语音，或换一个装置。'],
           es:'No se encontró una voz de chino (Taiwán) en este dispositivo, así que no se oirá el audio. Instala la voz «chino (Taiwán)» en los ajustes del móvil o usa otro dispositivo.',
           en:'No Chinese (Taiwan) voice was found on this device, so you won’t hear the audio. Install the “Chinese (Taiwan)” voice in your phone settings, or use another device.' },
    nosynth:{ zh:['這個瀏覽器不支援語音，聽不到念的內容。請換一個瀏覽器（例如 Chrome、Safari）。','这个浏览器不支援语音，听不到念的内容。请换一个浏览器（例如 Chrome、Safari）。'],
           es:'Este navegador no admite voz, así que no se oirá el audio. Usa otro navegador (por ejemplo Chrome o Safari).',
           en:'This browser does not support speech, so you won’t hear the audio. Try another browser (for example Chrome or Safari).' }
  };
  function show(kind){
    if(shown||document.getElementById('hgVoiceHint')) return; shown=true;
    var s=cfg(), lang=s.lang||'es', simp=s.script==='simp', t=T[kind];
    var st=document.createElement('style');
    st.textContent='#hgVoiceHint{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:2147482999;width:min(94vw,520px);box-sizing:border-box;display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:#fff6dc;border:1px solid #d8b24a;color:#5b4410;font:13px/1.4 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.25)}#hgVoiceHint .m{flex:1}#hgVoiceHint .m small{display:block;font-size:11px;opacity:.85;margin-top:2px}#hgVoiceHint button{border:0;background:transparent;color:inherit;font-size:16px;line-height:1;padding:0 2px;cursor:pointer}';
    document.head.appendChild(st);
    var d=document.createElement('div'); d.id='hgVoiceHint'; d.setAttribute('role','status');
    var m=document.createElement('div'); m.className='m';
    var zh=document.createElement('div'); zh.textContent = simp ? t.zh[1] : t.zh[0]; m.appendChild(zh);
    if(lang!=='zh'){ var sm=document.createElement('small'); sm.textContent = lang==='en' ? t.en : t.es; m.appendChild(sm); }
    var x=document.createElement('button'); x.type='button'; x.textContent='✕'; x.setAttribute('aria-label','Close');
    x.addEventListener('click',function(){ d.remove(); });
    d.appendChild(m); d.appendChild(x); document.body.appendChild(d);
  }
  function check(){
    try{
      if(!window.speechSynthesis){ show('nosynth'); return; }
      var vs=window.speechSynthesis.getVoices()||[];
      if(vs.length && !vs.some(isMandarin)) show('none');   // 清單是空的時（有些手機一開始就是空的）先不判斷
    }catch(e){}
  }
  function start(){
    check();
    try{ window.speechSynthesis.addEventListener('voiceschanged', check); }catch(e){}
    setTimeout(check,1500); setTimeout(check,4000);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
/* ===== /找不到中文聲音的提示 ===== */

</script>

<script>
/* ===== 遊玩紀錄（hgPlays）— 每個遊戲共用，貼在 </body> 前 =====
   用法：
     HGPlays.visit();                       // 頁面打開時（本檔會自動呼叫一次）
     HGPlays.start('easy', '小明');         // 真的開始玩一局（關卡／難度、暱稱都可省略）
     HGPlays.end({score: 120, name: '小明'}); // 這一局正常結算（score、name 可省略）
   沒呼叫 end 的那一局，後台就會顯示「沒玩完」。
   寫到 memorma 專案：plays（每局）、visits（每台裝置每天每遊戲一筆）。
   兩者都會多帶一個 tz（玩家裝置的時區，例如 America/Mexico_City），後台用它推測玩家來自哪個國家；抓不到就不帶。
   （memorma 的 Firestore 規則要允許 tz 欄位，主檔在 game-kit 的 firebase-rules/memorma-24dab.rules.txt）
   任何錯誤都靜默，不影響遊戲。 */
(function () {
  var GAME = 'detective_de_tonos';          // ← 每個遊戲改成自己的代號（英文小寫、底線）
  var NAME_GETTER = null;                // ← 可選：function(){ return 目前暱稱或'' }
  var CFG = { apiKey: 'AIzaSyC_YSDn2OH6_GKKwCq0d8QFNl3fYXzTC60', authDomain: 'memorma-24dab.firebaseapp.com',
              projectId: 'memorma-24dab', appId: '1:806709458465:web:f0d12acb2f911f2f165560' };
  var V = '10.12.2', CDN = 'https://www.gstatic.com/firebasejs/' + V + '/';
  var cur = null, readyP = null, lib = null;

  function tzName() { // 玩家裝置的時區；抓不到就回空字串（這時紀錄不帶 tz）
    try { return String(Intl.DateTimeFormat().resolvedOptions().timeZone || '').slice(0, 64); } catch (e) { return ''; }
  }
  var TZ = tzName();

  function gid() { try { return (HG.gameFn ? HG.gameFn() : GAME) || GAME; } catch (e) { return GAME; } } // taiwan-life 這類共用引擎的遊戲可改寫 HGPlays.gameFn
  function day() { // 以台灣時間（UTC+8）算「哪一天」，方便老師對帳
    var d = new Date(Date.now() + 8 * 3600e3);
    return d.toISOString().slice(0, 10);
  }
  function ls(k, v) {
    try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {}
    return null;
  }
  function ready() {
    if (readyP) return readyP;
    readyP = (async function () {
      var A = await import(CDN + 'firebase-app.js');
      var Au = await import(CDN + 'firebase-auth.js');
      var F = await import(CDN + 'firebase-firestore.js');
      var app = A.initializeApp(CFG, 'hgplays');
      var auth = Au.getAuth(app);
      if (!auth.currentUser) await Au.signInAnonymously(auth);
      else await auth.authStateReady();
      lib = { F: F, db: F.getFirestore(app), uid: auth.currentUser.uid };
      return lib;
    })().catch(function () { readyP = null; return null; });
    return readyP;
  }
  function getName(n) {
    if (n) return String(n).slice(0, 36);
    try { if (NAME_GETTER) return String(NAME_GETTER() || '').slice(0, 36); } catch (e) {}
    return '';
  }

  var HG = window.HGPlays = {
    /* 每台裝置每天、每個遊戲只算一次訪客 */
    visit: function () {
      var g = gid(), d = day(), key = 'hg.visit.' + g;
      if (ls(key) === d) return;
      ready().then(function (L) {
        if (!L) return;
        var id = d + '_' + g + '_' + L.uid;
        var v = { game: g, day: d, uid: L.uid, at: L.F.serverTimestamp() };
        if (TZ) v.tz = TZ;
        return L.F.setDoc(L.F.doc(L.db, 'visits', id), v)
          .then(function () { ls(key, d); });
      }).catch(function () {});
    },
    /* 真的開始玩一局 */
    start: function (level, name) {
      var mine = cur = { id: null, level: level == null ? '' : String(level).slice(0, 30) };
      ready().then(function (L) {
        if (!L) return;
        var data = { game: gid(), level: mine.level, uid: L.uid, name: getName(name), day: day(),
                     startedAt: L.F.serverTimestamp(), done: false };
        if (TZ) data.tz = TZ;
        return L.F.addDoc(L.F.collection(L.db, 'plays'), data).then(function (ref) {
          mine.id = ref.id; if (mine.pendingEnd) HG._finish(mine, mine.pendingEnd);
        });
      }).catch(function () {});
    },
    /* 這一局正常結算 */
    end: function (info) {
      var mine = cur; if (!mine || mine.ended) return; mine.ended = true; info = info || {};
      if (mine.id) HG._finish(mine, info); else mine.pendingEnd = info; // 開始的寫入還沒回來就先記著
    },
    _finish: function (mine, info) {
      ready().then(function (L) {
        if (!L || !mine.id) return;
        var u = { done: true, endedAt: L.F.serverTimestamp(),
                  secs: Math.max(0, Math.min(86400, Math.round(Number(info.secs != null ? info.secs : (Date.now() - (mine.t0 || Date.now())) / 1000) || 0))) };
        var s = Number(info.score); if (isFinite(s) && info.score != null) u.score = Math.max(-1e9, Math.min(1e9, Math.round(s)));
        var n = getName(info.name); if (n) u.name = n;
        return L.F.updateDoc(L.F.doc(L.db, 'plays', mine.id), u);
      }).catch(function () {});
    }
  };
  var _s = HG.start; HG.start = function (l, n) { _s(l, n); if (cur) cur.t0 = Date.now(); };
  setTimeout(function () { HG.visit(); }, 2500);   // 等遊戲載完再記訪客
})();
</script>
