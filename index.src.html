function tx(k){ const t=TXT[k]; const simp=Settings.script==='simp'; let z=t.zh[simp?1:0]; if(Settings.lang==='zh'||!(t.es||t.en)) return z; const o=Settings.lang==='en'?t.en:t.es; return z+(o?' · '+o:''); }
function tz(k){ const t=TXT[k]; return t.zh[Settings.script==='simp'?1:0]; }
function tl(k){ const t=TXT[k]; return Settings.lang==='en'?t.en:t.es; }

/* ===== 聲調標記 ===== */
const VM={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ'};
function mark(p,t){
  if(!t) return p;
  let idx=p.indexOf('a'); if(idx<0) idx=p.indexOf('e');
  if(idx<0){ const k=p.indexOf('ou'); if(k>=0) idx=k; }
  if(idx<0){ for(let i=p.length-1;i>=0;i--) if('iouü'.indexOf(p[i])>=0){idx=i;break;} }
  if(idx<0) return p;
  return p.slice(0,idx)+VM[p[idx]][t-1]+p.slice(idx+1);
}
const TMARK=['','ˉ','ˊ','ˇ','ˋ'];
const TPATH=['','2,3 18,3','2,10 18,3','2,4 7,10 18,3','2,2 18,10'];
function toneSvg(t){ return `<svg viewBox="0 0 20 12" aria-hidden="true"><polyline points="${TPATH[t]}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }

/* ===== 語音 ===== */
function pickVoice(){
  let vs=[]; try{ vs=window.speechSynthesis.getVoices()||[]; }catch(e){}
  const ok=v=>{ const l=String(v.lang||'').toLowerCase().replace(/_/g,'-'); if(l.indexOf('yue')===0||l.indexOf('zh-hk')===0) return false; return l==='zh'||l.indexOf('zh-')===0||l.indexOf('cmn')===0; };
  const tw=vs.filter(v=>{ const l=String(v.lang||'').toLowerCase().replace(/_/g,'-'); return l==='zh-tw'||l==='cmn-tw'||l.indexOf('zh-tw')===0; });
  return tw[0]||vs.filter(ok)[0]||null;
}
function speak(text){
  try{
    const ss=window.speechSynthesis; if(!ss) return; ss.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang='zh-TW';
    const v=pickVoice(); if(v){ u.voice=v; u.lang=v.lang; }
    u.rate=RATE_VALUE[Settings.rate]||0.65;
    const rec=on=>{ const b=document.querySelector('.listen'); if(b) b.classList.toggle('rec',on); };
    u.onstart=()=>rec(true); u.onend=u.onerror=()=>rec(false);
    ss.speak(u);
  }catch(e){}
}

/* ===== 排行榜（memorma-24dab；tone_boards/{read|listen}/entries/{uid}；文件 id＝匿名 uid；前 10 名）=====
   只有選「全部」玩完一局才上榜；分數＝答對率×1000（整數，例如 97.3% 存 973）；每台裝置每個榜只留最高分 */
const LB_CFG={apiKey:'AIzaSyC_YSDn2OH6_GKKwCq0d8QFNl3fYXzTC60',authDomain:'memorma-24dab.firebaseapp.com',projectId:'memorma-24dab',appId:'1:806709458465:web:f0d12acb2f911f2f165560'};
let fbP=null;
function fbInit(){
  if(fbP) return fbP;
  const CDN='https://www.gstatic.com/firebasejs/10.12.2/';
  fbP=(async()=>{
    const A=await import(CDN+'firebase-app.js'),Au=await import(CDN+'firebase-auth.js'),F=await import(CDN+'firebase-firestore.js');
    const app=A.initializeApp(LB_CFG,'tonlb'), auth=Au.getAuth(app);
    let user=auth.currentUser;
    if(!user){ const c=await Au.signInAnonymously(auth); user=(c&&c.user)||auth.currentUser; }
    return {F,db:F.getFirestore(app),uid:user.uid};
  })().catch(()=>{ fbP=null; return null; });
  return fbP;
}
const NAME_KEY='detectiveTonos.name'; let memName='';
function getName(){ let v=''; try{ v=localStorage.getItem(NAME_KEY)||''; }catch(e){} return String(v||memName||'').trim().slice(0,14); }
function setName(n){ memName=n; try{ localStorage.setItem(NAME_KEY,n); }catch(e){} }
const topCache={};
async function submitScore(mode,name,score){
  const L=await fbInit(); if(!L) throw new Error('no firebase');
  const ref=L.F.doc(L.db,'tone_boards',mode,'entries',L.uid);
  const snap=await L.F.getDoc(ref);
  if(snap.exists()){ const old=snap.data(); if(old.score>=score){ if(old.name===name) return 'kept'; score=old.score; } }   // 不比舊的高：分數維持，只更新暱稱
  await L.F.setDoc(ref,{name,score,updatedAt:L.F.serverTimestamp()});
  topCache[mode]=null; return 'saved';
}
async function fetchTop(mode){
  const c=topCache[mode]; if(c&&Date.now()-c.t<60000) return c.v;   // 60 秒暫存，反覆開關不重複讀取
  const L=await fbInit(); if(!L) throw new Error('no firebase');
  const q=L.F.query(L.F.collection(L.db,'tone_boards',mode,'entries'),L.F.orderBy('score','desc'),L.F.limit(10));
  const snap=await L.F.getDocs(q);
  const rows=snap.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>b.score-a.score).slice(0,10);
  const v={rows,uid:L.uid}; topCache[mode]={t:Date.now(),v}; return v;
}
const pct=s=>(s/10).toFixed(1)+'%';
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ===== 遊戲狀態 ===== */
const app=document.getElementById('app');
let boardMode='read', screen='home', qs=[], qi=0, ans=[], checked=false, tot={syl:0,good:0,perfect:0};
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sentText(s){ return (Settings.script==='simp'?s.s:s.t).join(''); }
function top(){ window.scrollTo(0,0); }

const MAG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/></svg>';
const HAT='<svg class="hat" viewBox="0 0 32 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 15C7 9.5 10.5 6.2 16 6.2S25 9.5 25 15"/><path d="M7 15h18"/><path d="M7 15C5 15 3 16 2 18.6c3 1 6 .4 8-1.2M25 15c2 0 4 1 5 3.6-3 1-6 .4-8-1.2"/><path d="M8.2 11.8Q16 13.6 23.8 11.8"/><path d="M16 6.2V4.6M16 4.6C14.4 2.6 12.6 3 13 4.6c.4 1.1 2 .8 3 0zM16 4.6c1.6-2 3.4-1.6 3 0-.4 1.1-2 .8-3 0z"/></svg>';
const FOOT='<svg class="f" viewBox="0 0 10 17" fill="currentColor" aria-hidden="true"><ellipse cx="5" cy="5.2" rx="3.7" ry="5"/><ellipse cx="5" cy="13.6" rx="2.7" ry="3"/></svg>';
function steps(i,n){ let s=''; for(let k=0;k<n;k++) s+=`<i class="ft${k<i?' past':k===i?' now':''}${k%2?' r':''}">${FOOT}</i>`; return `<span class="steps" role="img" aria-label="${i+1} / ${n}">${s}</span>`; }
function rankIcon(score){ return `<span class="rk">${score>=950?HAT:score>=800?FOOT+FOOT:MAG}</span>`; }
const DOOR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 21V4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21M4 21h16"/><circle cx="14.5" cy="12.5" r="1"/></svg>';
let helpOpen=false, leaveAsk=false;
const wideMQ=window.matchMedia('(min-width:900px)');
function header(){
  return `<div class="top"><h1>${MAG}${tz('title')}${HAT}<small>Detective de tonos</small></h1><div class="tb">${screen==='play'?`<button class="help" id="bMenu">${DOOR}${tz('menu')}${Settings.lang==='zh'?'':'<span class="l2"> · '+tl('menu')+'</span>'}</button>`:''}<button class="help${helpOpen?' on':''}" id="bHelp">ℹ ${tz('help')}${Settings.lang==='zh'?'':'<span class="l2"> · '+tl('help')+'</span>'}</button></div></div>
  <div class="bar">
    <div class="grp"><span>${tz('scriptName')}</span><span class="seg" id="sgScript"><button data-v="trad" class="${Settings.script==='trad'?'on':''}">繁</button><button data-v="simp" class="${Settings.script==='simp'?'on':''}">简</button></span></div>
    <div class="grp"><span>Idioma</span><span class="seg" id="sgLang"><button data-v="es" class="${Settings.lang==='es'?'on':''}">ES</button><button data-v="en" class="${Settings.lang==='en'?'on':''}">EN</button><button data-v="zh" class="${Settings.lang==='zh'?'on':''}">中文</button></span></div>
  </div>
  ${helpOpen?`<div class="note">${tz('note')}${Settings.lang==='zh'?'':`<small>${tl('note')}</small>`}${G.mode==='listen'?`<div style="margin-top:6px">${tz('listenNote')}${Settings.lang==='zh'?'':`<small>${tl('listenNote')}</small>`}</div>`:''}</div>`:''}<div class="trace" aria-hidden="true"></div>${leaveAsk?`<div class="modal"><div class="box"><p>${tz('leaveQ')}${Settings.lang==='zh'?'':`<small>${tl('leaveQ')}</small>`}</p><div class="row"><button class="btn" id="bLeave">${tz('leave')}</button><button class="btn ghost" id="bStay">${tz('stay')}</button></div></div></div>`:''}`;
}
function bindHeader(){
  const bm=document.getElementById('bMenu'); if(bm) bm.onclick=()=>{ leaveAsk=true; render(false); };
  const bl=document.getElementById('bLeave'); if(bl) bl.onclick=()=>{ leaveAsk=false; screen='home'; render(true); };
  const bs=document.getElementById('bStay'); if(bs) bs.onclick=()=>{ leaveAsk=false; render(false); };
  const hb=document.getElementById('bHelp'); if(hb) hb.onclick=()=>{ helpOpen=!helpOpen; render(false); };
  document.querySelectorAll('#sgScript button').forEach(b=>b.onclick=()=>{ Settings.script=b.dataset.v; writeSettings(Settings); render(true); });
  document.querySelectorAll('#sgLang button').forEach(b=>b.onclick=()=>{ Settings.lang=b.dataset.v; writeSettings(Settings); render(true); });
}

function renderHome(){
  const lvs=['all','A1','A2','B1'];
  app.innerHTML=header()+`<div class="card vprint">
    <div class="choose" id="chMode">
      <button data-v="read" class="${G.mode==='read'?'on':''}"><b>${tz('modeRead')}</b>${Settings.lang==='zh'?'':`<span>${tl('modeRead')}</span>`}</button>
      <button data-v="listen" class="${G.mode==='listen'?'on':''}"><b>${tz('modeListen')}</b>${Settings.lang==='zh'?'':`<span>${tl('modeListen')}</span>`}</button>
    </div>
    <div class="row" style="margin-bottom:10px"><span class="sub">${tx('level')}</span><span class="seg" id="sgLv">${lvs.map(l=>`<button data-v="${l}" class="${G.level===l?'on':''}">${l==='all'?tz('all'):l}</button>`).join('')}</span></div>
    <div class="row" style="margin-bottom:14px"><span class="sub">${tx('speed')}</span><span class="seg" id="sgRate">${['slow','normal','fast'].map(r=>`<button data-v="${r}" class="${Settings.rate===r?'on':''}">${tz(r)}</button>`).join('')}</span></div>
    <div style="margin-bottom:14px"><div class="sub" style="margin-bottom:4px">${tz('nameLab')}${Settings.lang==='zh'?'':'<br>'+tl('nameLab')}</div><input class="nm" id="nm" maxlength="14" placeholder="${esc(tz('namePh'))}" value="${esc(getName())}"><div class="sub" id="nmHint" style="color:#a8453a;min-height:18px"></div></div>
    <div class="row"><button class="btn" id="bStart">${tz('start')}</button><button class="btn ghost" id="bBoard">🏆 ${tz('board')}</button></div>${Settings.lang==='zh'?'':`<div class="sub" style="margin-top:4px">${tl('start')}</div>`}
  </div>`;
  bindHeader();
  document.querySelectorAll('#chMode button').forEach(b=>b.onclick=()=>{ G.mode=b.dataset.v; writeG(); render(true); });
  document.querySelectorAll('#sgLv button').forEach(b=>b.onclick=()=>{ G.level=b.dataset.v; writeG(); render(true); });
  document.querySelectorAll('#sgRate button').forEach(b=>b.onclick=()=>{ Settings.rate=b.dataset.v; writeSettings(Settings); render(true); });
  document.getElementById('nm').addEventListener('input',e=>setName(e.target.value.trim().slice(0,14)));
  document.getElementById('bStart').onclick=startGame;
  document.getElementById('bBoard').onclick=()=>{ boardMode=G.mode; screen='board'; render(true); };
}

function startGame(){
  if(screen==='home'&&G.level==='all'){
    const el=document.getElementById('nm'), nm=el?el.value.trim().slice(0,14):getName();
    if(!nm){ const h=document.getElementById('nmHint'); if(h) h.textContent=tz('needName'); if(el){ el.classList.remove('bad'); void el.offsetWidth; el.classList.add('bad'); el.focus(); } return; }
    setName(nm);
  }
  const pool=SENTENCES.filter(s=>G.level==='all'||s.lv===G.level);
  qs=shuffle(pool).slice(0,10); qi=0; tot={syl:0,good:0,perfect:0}; screen='play'; resultSent=false;
  try{ HGPlays.start(G.mode+'_'+G.level); }catch(e){}
  newQ();
}
function newQ(){ const s=qs[qi]; ans=s.a.map(a=>a===0?0:null); checked=false; render(true); if(G.mode==='listen') speak(sentText(s)); }

function renderPlay(){
  const s=qs[qi], listen=G.mode==='listen', simp=Settings.script==='simp';
  const chars=simp?s.s:s.t;
  let html=header()+`<div class="card"><div class="prog"><span class="tag">${tz('case')} ${s.id}</span>${steps(qi,qs.length)}</div>`;
  if(listen) html+=`<div class="listen"><button class="spk" id="bSpk" aria-label="${tz('replay')}">🔊</button><span class="reels"><i></i><i></i></span><div class="sub">${checked?tz('replay'):tz('listenFirst')}${Settings.lang==='zh'?'':'<br>'+(checked?tl('replay'):tl('listenFirst'))}</div></div>`;
  html+=`<div class="words${s.t.length>=10&&!wideMQ.matches?' compact':''}">`;
  let pos=0;
  s.w.forEach(n=>{
    html+='<div class="word">';
    for(let k=0;k<n;k++){
      const i=pos+k, a=s.a[i], neutral=a===0, v=ans[i];
      let cls='syl', py=s.p[i], fix='';
      if(checked&&!neutral){ cls+=v===a?' ok':' bad'; if(v!==a) fix=mark(s.p[i],a); }
      const shown=neutral?s.p[i]:(v?mark(s.p[i],v):s.p[i]);
      const hz=(!listen||checked)?chars[i]:'';
      html+=`<div class="${cls}" data-i="${i}"><div class="hz">${hz}</div><div class="py${v&&!neutral?' done':''}">${shown}</div>`;
      if(neutral) html+=`<div class="neu">${tz('neutral')}</div>`;
      else html+=`<div class="tones">${[1,2,3,4].map(t=>`<button data-t="${t}" class="${v===t?'on':''}" ${checked?'disabled':''} aria-label="tone ${t}">${toneSvg(t)}<small>${t}</small></button>`).join('')}</div>`;
      if(checked&&!neutral) html+=`<div class="fix">${v===a?'':fix}</div>`;
      html+='</div>';
    }
    pos+=n; html+='</div>';
  });
  html+='</div>';
  const filled=ans.every(x=>x!==null);
  if(!checked){
    html+=`<div class="row" style="margin-top:12px"><button class="btn" id="bCheck" ${filled?'':'disabled'}>${MAG}${tz('check')}</button>${filled?'':`<span class="sub">${tz('fillAll')}</span>`}</div>`;
  } else {
    const bad=s.a.reduce((n,a,i)=>n+(a!==0&&ans[i]!==a?1:0),0), need=s.a.filter(a=>a!==0).length;
    const full=chars.map((c,i)=>c).join('');
    const fullPy=s.w.reduce((acc,n)=>{ const word=[]; for(let k=0;k<n;k++){ word.push(mark(s.p[acc.p+k],s.a[acc.p+k])); } acc.out.push(word.join(' ')); acc.p+=n; return acc; },{out:[],p:0}).out.join(' ');
    html+=`<div class="res"><div class="score">${need-bad} / ${need} ${tz('goodSyl')}${bad===0?' ✓':''}</div><div class="line">${full}</div><div class="line" style="color:#6f6a60">${fullPy}</div>${Settings.lang==='zh'?'':`<div class="tr">${Settings.lang==='en'?s.en:s.es}</div>`}
    <div class="row" style="margin-top:12px">${listen?'':`<button class="btn ghost" id="bSpk2">🔊 ${tz('replay')}</button>`}<button class="btn" id="bNext">${qi+1<qs.length?tz('next'):tz('finish')}</button></div></div>`;
  }
  html+='</div>';
  app.innerHTML=html; bindHeader();
  app.querySelectorAll('.syl').forEach(el=>{
    el.querySelectorAll('.tones button').forEach(b=>b.onclick=()=>{ if(checked) return; ans[+el.dataset.i]=+b.dataset.t; renderPlay(); });
  });
  const sp=document.getElementById('bSpk'); if(sp) sp.onclick=()=>speak(sentText(s));
  const sp2=document.getElementById('bSpk2'); if(sp2) sp2.onclick=()=>speak(sentText(s));
  const bc=document.getElementById('bCheck'); if(bc) bc.onclick=doCheck;
  const bn=document.getElementById('bNext'); if(bn) bn.onclick=()=>{ if(qi+1<qs.length){ qi++; newQ(); } else { screen='result'; render(true); try{ HGPlays.end({score:tot.good}); }catch(e){} } };
}
function doCheck(){
  const s=qs[qi]; checked=true; let bad=0, need=0;
  s.a.forEach((a,i)=>{ if(a!==0){ need++; if(ans[i]!==a) bad++; } });
  tot.syl+=need; tot.good+=need-bad; if(bad===0) tot.perfect++;
  renderPlay();
}
function renderResult(){
  const ranked=G.level==='all'&&tot.syl>0, score=tot.syl?Math.round(tot.good/tot.syl*1000):0;
  app.innerHTML=header()+`<div class="card vprint vtop"><div class="sub">${tz('result')}</div><div class="big">${tot.good} / ${tot.syl}</div><div class="rank">${rankIcon(score)}${tz(score>=950?'rankA':score>=800?'rankB':'rankC')}${Settings.lang==='zh'?'':' · '+tl(score>=950?'rankA':score>=800?'rankB':'rankC')}</div><div class="score">${tz('goodSyl')}　${tz('accuracy')} ${pct(score)}</div><div class="score">${tz('perfect')}：${tot.perfect} / ${qs.length}</div>
  <div class="lbmsg" id="lbMsg">${ranked?tz('sending'):tz('notRanked')}${!ranked&&Settings.lang!=='zh'?'<br>'+tl('notRanked'):''}</div>
  <div class="row" style="margin-top:12px"><button class="btn" id="bAgain">${tz('again')}</button><button class="btn ghost" id="bBoard">🏆 ${tz('board')}</button><button class="btn ghost" id="bHome">${tz('home')}</button></div></div>`;
  bindHeader();
  document.getElementById('bAgain').onclick=startGame;
  document.getElementById('bBoard').onclick=()=>{ boardMode=G.mode; screen='board'; render(true); };
  document.getElementById('bHome').onclick=()=>{ screen='home'; render(true); };
  if(ranked&&!resultSent){
    resultSent=true; resultMsgKey='sending';
    const msg=k=>{ resultMsgKey=k; const el=document.getElementById('lbMsg'); if(el) el.textContent=tz(k); };
    submitScore(G.mode,getName(),score).then(r=>msg(r==='kept'?'kept':'submitted')).catch(()=>msg('submitFail'));
  } else if(ranked&&resultSent){ const el=document.getElementById('lbMsg'); if(el) el.textContent=tz(resultMsgKey); }
}
function renderBoard(){
  app.innerHTML=header()+`<div class="card"><div class="row" style="margin-bottom:8px"><b style="font-size:17px">🏆 ${tz('board')}</b><span class="seg" id="sgBoard"><button data-v="read" class="${boardMode==='read'?'on':''}">${tz('modeRead')}</button><button data-v="listen" class="${boardMode==='listen'?'on':''}">${tz('modeListen')}</button></span></div>
  <div id="lbBody"><p class="sub">${tz('loading')}</p></div><div class="hint">${tz('boardNote')}${Settings.lang==='zh'?'':'<br>'+tl('boardNote')}</div>
  <div class="row" style="margin-top:12px"><button class="btn ghost" id="bBack">${tz('back')}</button></div></div>`;
  bindHeader();
  document.querySelectorAll('#sgBoard button').forEach(b=>b.onclick=()=>{ boardMode=b.dataset.v; renderBoard(); });
  document.getElementById('bBack').onclick=()=>{ screen=prevScreen; render(true); };
  const mine=boardMode;
  fetchTop(mine).then(({rows,uid})=>{
    const el=document.getElementById('lbBody'); if(!el||mine!==boardMode) return;
    el.innerHTML=rows.length?rows.map((r,i)=>`<div class="lbrow${r.id===uid?' me':''}"><span class="r">${i+1}</span><span class="n">${esc(r.name||'')}${r.id===uid?' '+esc(tz('you')):''}</span><span class="s">${pct(r.score|0)}</span></div>`).join(''):`<p class="sub">${tz('boardEmpty')}</p>`;
  }).catch(()=>{ const el=document.getElementById('lbBody'); if(el&&mine===boardMode) el.innerHTML=`<p class="sub">${tz('boardFail')}</p>`; });
}
let prevScreen='home', resultSent=false, resultMsgKey='submitted';
function render(scroll){
  if(screen!=='board') prevScreen=screen;
  if(screen==='home') renderHome(); else if(screen==='play') renderPlay(); else if(screen==='board') renderBoard(); else renderResult();
  document.documentElement.lang=Settings.script==='simp'?'zh-Hans':'zh-Hant';
  if(scroll) top();
}
wideMQ.addEventListener&&wideMQ.addEventListener('change',()=>render(false));
render();
})();
